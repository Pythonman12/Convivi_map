<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>전국 편의점 지도 | 54,446개 매장 검색</title>
  <meta name="description" content="대한민국 전국 54,446개 편의점 위치, 브랜드, 시·도 및 시·군·구별 상세 검색을 제공하는 무료 반응형 지도 서비스입니다.">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  
  <!-- Pretendard / Google Font Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Custom Style -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Desktop / Mobile Sidebar Panel -->
    <aside id="sidebar" class="sidebar">
      <header class="sidebar-header">
        <div class="logo-area">
          <div class="logo-icon">🏪</div>
          <div>
            <h1 class="logo-title">전국 편의점 지도</h1>
            <p class="logo-sub">전국 전역 54,446개소 위치 정보</p>
          </div>
        </div>
        <button id="closeSidebarBtn" class="icon-btn mobile-only" aria-label="사이드바 닫기">✕</button>
      </header>

      <!-- Search Controls -->
      <section class="filter-section">
        <!-- Keyword Search -->
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="상호명, 지점명, 도로명, 동/읍/면 검색..." autocomplete="off">
          <button id="clearSearchBtn" class="clear-btn" style="display:none;" title="검색어 지우기">✕</button>
        </div>

        <!-- 2-Tier Region & Geo Controls -->
        <div class="region-controls">
          <div class="select-wrapper">
            <select id="sidoSelect" aria-label="시/도 선택">
              <option value="">전국 전체 (17개 시·도)</option>
              <option value="서울특별시">서울특별시 (9,395)</option>
              <option value="경기도">경기도 (14,871)</option>
              <option value="부산광역시">부산광역시 (2,780)</option>
              <option value="인천광역시">인천광역시 (2,968)</option>
              <option value="대구광역시">대구광역시 (2,037)</option>
              <option value="대전광역시">대전광역시 (1,465)</option>
              <option value="광주광역시">광주전남 (3,097)</option>
              <option value="울산광역시">울산광역시 (1,125)</option>
              <option value="세종특별자치시">세종특별자치시 (318)</option>
              <option value="강원특별자치도">강원특별자치도 (2,381)</option>
              <option value="충청북도">충청북도 (1,999)</option>
              <option value="충청남도">충청남도 (2,887)</option>
              <option value="전북특별자치도">전북특별자치도 (1,761)</option>
              <option value="경상북도">경상북도 (2,733)</option>
              <option value="경상남도">경상남도 (3,305)</option>
              <option value="제주특별자치도">제주특별자치도 (1,324)</option>
            </select>
          </div>
          <div class="select-row-secondary">
            <div class="select-wrapper flex-1">
              <select id="guSelect" aria-label="시/군/구 선택">
                <option value="">시·군·구 전체</option>
              </select>
            </div>
            <button id="geoBtn" class="btn btn-secondary geo-btn" title="내 위치 주변 편의점 찾기">
              <span class="geo-icon">📍</span> 내 위치
            </button>
          </div>
        </div>

        <!-- Brand Filter Chips -->
        <div class="brand-chips-container">
          <div class="chips-label">브랜드 필터:</div>
          <div class="chips-wrapper" id="brandChips">
            <button class="chip active" data-brand="ALL">전체 <span class="chip-count" id="countALL">54,446</span></button>
            <button class="chip brand-cu" data-brand="CU">CU <span class="chip-count" id="countCU">16,317</span></button>
            <button class="chip brand-gs25" data-brand="GS25">GS25 <span class="chip-count" id="countGS25">15,039</span></button>
            <button class="chip brand-seven" data-brand="세븐일레븐">세븐일레븐 <span class="chip-count" id="count711">9,508</span></button>
            <button class="chip brand-emart24" data-brand="이마트24">이마트24 <span class="chip-count" id="countEmart24">4,942</span></button>
            <button class="chip brand-ministop" data-brand="미니스톱">미니스톱 <span class="chip-count" id="countMinistop">930</span></button>
            <button class="chip brand-cspace" data-brand="씨스페이스">씨스페이스 <span class="chip-count" id="countCspace">203</span></button>
            <button class="chip brand-other" data-brand="기타">기타·개인 <span class="chip-count" id="countOther">7,468</span></button>
          </div>
        </div>
      </section>

      <!-- Status Bar -->
      <div class="status-bar">
        <span>검색 결과: <strong id="matchCount">54,446</strong>개</span>
        <button id="resetFilterBtn" class="link-btn">필터 초기화</button>
      </div>

      <!-- Store List View -->
      <div class="store-list" id="storeList">
        <!-- Rendered dynamically by JS -->
      </div>
    </aside>

    <!-- Main Map View Area -->
    <main class="map-container">
      <!-- Mobile Floating Search Bar -->
      <div class="mobile-top-bar">
        <div class="mobile-search-pill" id="mobileSearchTrigger">
          <span class="search-icon">🔍</span>
          <span class="mobile-search-placeholder" id="mobileSearchText">편의점 검색 및 필터</span>
        </div>
        <button id="mobileGeoBtn" class="mobile-circle-btn" title="내 위치 찾기">📍</button>
      </div>

      <!-- Free Map Canvas -->
      <div id="map"></div>

      <!-- Floating Map Controls -->
      <div class="map-floating-controls">
        <button id="mapResetViewBtn" class="floating-btn" title="전국 전체보기">
          <span>🗺️ 전국 전체</span>
        </button>
        <button id="toggleTileBtn" class="floating-btn" title="지도 스타일 변경">
          <span>🎨 스타일 변경</span>
        </button>
      </div>

      <!-- Mobile Bottom Sheet Toggle -->
      <div id="mobileSheetHandle" class="mobile-sheet-handle">
        <div class="sheet-indicator"></div>
        <div class="sheet-title-bar">
          <span class="sheet-title">🏪 매장 목록 (<strong id="mobileListCount">54,446</strong>개)</span>
          <span class="sheet-chevron" id="sheetChevron">▲</span>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">주소가 복사되었습니다!</div>

  <!-- Data & Scripts -->
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Leaflet MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  
  <!-- Stores Data (Offline / file:// compatible) -->
  <script src="stores-data.js?v=5"></script>
  <!-- Main Application Logic -->
  <script src="app.js?v=5"></script>
</body>
</html>
